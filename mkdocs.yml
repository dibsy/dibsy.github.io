site_name: Dibyendu SIKDAR
site_description: Offensive & Defesive Operations covering Web, Cloud, Infra, CTFs and many more..
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: blue
  font: false
  features:
    - navigation.tabs
    - content.code.copy
    - content.code.annotate
plugins:
  - search
  - blog:
      blog_dir: .
      post_excerpt: optional  # Enable excerptse
      
  - tags
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About: about.md
  - GitHub: https://github.com/dibsy/
  - Old Blog : https://oxhat.blogspot.com/
